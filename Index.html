<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentation Hub — YnSoyn</title>
<style>
@import url('https://cdn.rawgit.com/moonspam/NanumSquare/master/nanumsquare.css');

@font-face {
  font-family: 'JeongsinCharyeot';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-01@1.0/EF_WAKEUP.woff2') format('woff2');
  font-weight: normal;
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'NanumSquare', sans-serif;
  background: #e8ecf8;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.blob { position: fixed; border-radius: 50%; filter: blur(72px); opacity: 0.48; z-index: 0; pointer-events: none; }
.blob-tl { width: 400px; height: 400px; background: radial-gradient(circle, #6b8dff 0%, #2f4cdd 100%); top: -150px; left: -100px; }
.blob-br { width: 350px; height: 350px; background: radial-gradient(circle, #5577ff 0%, #1e38cc 100%); bottom: -100px; right: -50px; }

.hub-container {
  position: relative; z-index: 1;
  width: 90%; max-width: 800px;
  text-align: center;
}

h1 {
  font-family: 'JeongsinCharyeot', sans-serif;
  font-size: 60px;
  color: #1a1a2e;
  margin-bottom: 40px;
  letter-spacing: 1px;
}

.ppt-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.ppt-card {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(59, 91, 219, 0.1);
  border-radius: 20px;
  padding: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-decoration: none;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
  box-shadow: 0 10px 30px rgba(30, 50, 150, 0.08);
}

.ppt-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 20px 40px rgba(59, 91, 219, 0.15);
  background: #fff;
}

.ppt-info { text-align: left; }
.ppt-tag {
  display: inline-block;
  padding: 4px 12px;
  background: #eef1fc;
  color: #3B5BDB;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}
.ppt-title {
  font-size: 24px;
  font-weight: 800;
  color: #1a1a2e;
  margin-bottom: 4px;
}
.ppt-desc { font-size: 14px; color: #777; }

.arrow-icon {
  width: 50px; height: 50px;
  background: linear-gradient(135deg, #4B6BFF 0%, #2236CC 100%);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 24px;
  box-shadow: 0 4px 12px rgba(59, 91, 219, 0.3);
}
</style>
</head>
<body>

<div class="blob blob-tl"></div>
<div class="blob blob-br"></div>

<div class="hub-container">
  <h1>Presentation Hub</h1>
  
  <div class="ppt-list">
    <!-- Moving XR Space 발표자료 -->
    <a href="movingXRspace_FinalPPT_2026-1_Class-DigitalMediaStudy.html" class="ppt-card">
      <div class="ppt-info">
        <div class="ppt-tag">2026-1 DIGITAL MEDIA STUDY</div>
        <div class="ppt-title">Moving XR Space</div>
        <div class="ppt-desc">멀미 저감 시각 모션큐 시스템 설계 및 Unity 시뮬레이션</div>
      </div>
      <div class="arrow-icon">→</div>
    </a>

    <!-- 추후 추가될 발표자료 자리 (Placeholder) -->
    <div style="opacity: 0.4; pointer-events: none;">
      <div class="ppt-card" style="background: rgba(255,255,255,0.5); border-style: dashed;">
        <div class="ppt-info">
          <div class="ppt-tag">UPCOMING</div>
          <div class="ppt-title">Next Presentation</div>
          <div class="ppt-desc">준비 중인 발표 자료입니다.</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
