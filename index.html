*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: #e8ecf8;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 20px 28px 14px;
  gap: 12px;
  position: relative;
}

/* ── DECORATIVE BLOBS ── */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(72px);
  opacity: 0.48;
  z-index: 0;
  pointer-events: none;
}
.blob-tl {
  width: 260px; height: 260px;
  background: radial-gradient(circle, #6b8dff 0%, #2f4cdd 100%);
  top: -110px; left: -60px;
}
.blob-tr {
  width: 300px; height: 300px;
  background: radial-gradient(circle, #5577ff 0%, #1e38cc 100%);
  top: -100px; right: -50px;
}
.blob-bl {
  width: 180px; height: 180px;
  background: radial-gradient(circle, #4B6BFF 0%, #1e3abb 100%);
  bottom: -50px; left: 20px;
}

/* ═══════════════════════════════════════════
   Z-INDEX LAYER
═══════════════════════════════════════════ */
#nav-area, #title-bar, #content-area, #cnt { position: relative; z-index: 1; }

/* ═══════════════════════════════════════════
   NAV — 원형 탭 + 연결선
═══════════════════════════════════════════ */
#nav-area {
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 52px;
}

#nav-track {
  position: relative;
  width: 88%;
  max-width: 880px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* 연결선 */
#nav-track::before {
  content: '';
  position: absolute;
  top: 50%; left: 0; right: 0;
  height: 2px;
  background: rgba(255,255,255,0.55);
  transform: translateY(-50%);
  z-index: 0;
}

.dot {
  position: relative; z-index: 1;
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-family: 'JeongsinCharyeot', sans-serif;
  font-size: 13px; font-weight: normal;
  color: #3B5BDB;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, box-shadow 0.2s;
  user-select: none; flex-shrink: 0;
}

.dot:hover:not(.active) {
  transform: scale(1.18);
  background: #fff;
}

.dot.active {
  transform: scale(1.5);
  background: linear-gradient(135deg, #4B6BFF 0%, #2236CC 100%);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 16px rgba(59,91,219,0.5);
}

/* ═══════════════════════════════════════════
   TITLE BAR
═══════════════════════════════════════════ */
#title-bar {
  flex-shrink: 0;
  display: flex;
  justify-content: center;
}

#title-inner {
  width: 80%;
  max-width: 820px;
  background: linear-gradient(135deg, #3B5BDB 0%, #1E3AA8 100%);
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 13px 48px;
  text-align: center;
  font-family: 'MonoplexWideItalic', monospace;
  font-weight: 800;
  font-size: 40px;
  letter-spacing: 0.5px;
  box-shadow: 0 6px 24px rgba(59,91,219,0.38);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.2s;
}

/* ═══════════════════════════════════════════
   CONTENT AREA
═══════════════════════════════════════════ */
#content-area {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 0;
}

/* 화살표 버튼 */
.arr {
  flex-shrink: 0;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(4px);
  border: none;
  cursor: pointer;
  color: #3B5BDB;
  border-radius: 50%;
  width: 42px; height: 42px;
  font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 12px rgba(0,0,60,0.12);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 300; line-height: 1;
  transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
  user-select: none;
}
.arr:hover:not(:disabled) {
  background: #fff;
  transform: scale(1.1);
  box-shadow: 0 4px 18px rgba(59,91,219,0.28);
}
.arr:disabled { opacity: 0.22; cursor: default; pointer-events: none; }

/* 슬라이드 박스 — 흰 카드 */
#slide-box {
  flex: 1;
  background: #fff;
  border: none;
  border-radius: 18px;
  box-shadow: 0 8px 36px rgba(30,50,150,0.1);
  height: 100%;
  overflow: hidden;
  position: relative;
}

/* ═══════════════════════════════════════════
   SLIDE 전환 애니메이션
═══════════════════════════════════════════ */
.slide {
  position: absolute;
  inset: 0;
  padding: 18px 24px 10px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s ease, transform 0.28s ease;
}

.sbody { flex: 1; display: flex; min-height: 0; gap: 12px; }

.slide.from-right { transform: translateX(40px); }
.slide.from-left  { transform: translateX(-40px); }

.slide.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: all;
}

/* ═══════════════════════════════════════════
   슬라이드 내부 스타일
═══════════════════════════════════════════ */

/* 제목 슬라이드 */

/* ── 배경 홀로그램 오버레이 (아주 천천히) ── */
@keyframes bg-holo {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.bg-holo-overlay {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  background: linear-gradient(
    125deg,
    transparent 0%,
    rgba(110, 174, 255, 0.45) 20%,
    rgba(220, 140, 255, 0.40) 40%,
    rgba(100, 255, 200, 0.38) 60%,
    rgba(255, 200, 120, 0.35) 80%,
    transparent 100%
  );
  background-size: 400% 400%;
  animation: bg-holo 8s ease infinite;
  pointer-events: none;
  mix-blend-mode: screen;
}

/* ── Holoride 캐러셀 ── */
.holo-carousel {
  position: relative; overflow: hidden;
  border-radius: 8px; width: 100%; height: 100%;
}
.holo-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.7s ease;
}
.holo-img.on { opacity: 1; }

/* 페이지 카운터 */
#cnt {

]; // end SLIDES

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
let cur = 0;
const track = document.getElementById('nav-track');
const box   = document.getElementById('slide-box');

// 원형 탭 + 슬라이드 생성
SLIDES.forEach((s, i) => {
  // dot
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.id = 'dot' + i;
  dot.textContent = String(i + 1).padStart(2, '0');
  dot.title = s.title;
  dot.onclick = () => goTo(i, i > cur ? 'right' : 'left');
  track.appendChild(dot);

  // slide
  const div = document.createElement('div');
  div.className = 'slide' + (i === 0 ? ' active' : ' from-right');
  div.id = 'sl' + i;
  div.innerHTML = s.html;
  box.appendChild(div);
});

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
function goTo(n, dir) {
  if (n === cur) return;
  const prevSlide = document.getElementById('sl' + cur);
  const nextSlide = document.getElementById('sl' + n);
  const prevDot   = document.getElementById('dot' + cur);
  const nextDot   = document.getElementById('dot' + n);

  // 나가는 슬라이드
  prevSlide.classList.remove('active');
  prevSlide.classList.add(dir === 'right' ? 'from-left' : 'from-right');
  setTimeout(() => {
    prevSlide.classList.remove('from-left', 'from-right');
  }, 300);

  // 들어오는 슬라이드
  nextSlide.classList.remove('from-left', 'from-right');
  nextSlide.classList.add(dir === 'right' ? 'from-right' : 'from-left');
  // reflow trigger
  void nextSlide.offsetWidth;
  nextSlide.classList.add('active');
  nextSlide.classList.remove('from-right', 'from-left');

  // 탭
  prevDot.classList.remove('active');
  nextDot.classList.add('active');

  // 제목
  document.getElementById('title-inner').textContent = SLIDES[n].title;

  cur = n;
  ui();
}

function move(d) {
  goTo(cur + d, d > 0 ? 'right' : 'left');
}

function ui() {
  document.getElementById('pbtn').disabled = cur === 0;
  document.getElementById('nbtn').disabled = cur === SLIDES.length - 1;
  document.getElementById('cnt').textContent = (cur + 1) + ' / ' + SLIDES.length;
}

// 초기 제목 설정
document.getElementById('title-inner').textContent = SLIDES[0].title;
ui();

// ─────────────────────────────────────────────
// HOLORIDE 캐러셀
// ─────────────────────────────────────────────
(function initCarousels() {
  document.querySelectorAll('.holo-carousel').forEach(carousel => {
    const imgs = Array.from(carousel.querySelectorAll('.holo-img'));
    if (imgs.length < 2) return;
    let idx = 0;
    setInterval(() => {
      imgs[idx].classList.remove('on');
      idx = (idx + 1) % imgs.length;
      imgs[idx].classList.add('on');
    }, 3000);
  });
})();

// 키보드
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') move(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   move(-1);
});
</script>
</body>
</html>
